<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3f3">
  <title data-i18n="StackForge · 任务中心">StackForge · Tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M16 7H7v26h9m8-26h9v26h-9M16 27l8-14' fill='none' stroke='%231b6c80' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/tasks/styles.css">
  <script type="module" src="/tasks.js"></script>
</head>
<body class="tasks-page">
  <a class="skip-link" href="#main" data-i18n="跳到主要内容">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="StackForge home" data-i18n-aria-label="StackForge 首页"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><path d="M16 7H7v26h9m8-26h9v26h-9M16 27l8-14"/></svg><span>StackForge</span></a>
    <div class="workspace"><span data-i18n="本地工作空间">Local workspace</span> <span>v{{version}}</span></div>
    <a class="side-link" href="/#project-form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="创建项目">Create project</span></a>
    <a class="side-active" href="/tasks" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg><span data-i18n="任务中心">Tasks</span></a>
    <a class="side-link" href="/projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2h7v2"/></svg><span data-i18n="项目管理">Projects</span></a>
    <div class="side-footer"><span data-i18n="MIT 开源">MIT licensed</span><a href="https://github.com/kentsee02/stackforge" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a></div>
  </aside>
  <div class="body-shell">
    <header class="topbar">
      <span><span data-i18n="工作空间">Workspace</span> <span class="slash">/</span> <span data-i18n="任务中心">Tasks</span></span>
      <div class="topbar-tools"><a class="mobile-task-link" href="/projects" data-i18n="项目管理">Projects</a><label class="language-control" for="language">Language / 语言<select id="language" aria-label="Language / 语言"><option value="en" lang="en">English</option><option value="zh-CN" lang="zh-CN">华文</option></select></label></div>
    </header>
    <main id="main" class="sheet">
      <div class="title-row task-title">
        <h1 data-i18n="任务中心">Tasks</h1>
        <button id="task-refresh" class="secondary" type="button" data-i18n="刷新任务">Refresh tasks</button>
      </div>
      <p id="task-feedback" class="hint task-notice" role="status"></p>
      <section class="task-section" aria-labelledby="active-task-title">
        <h2 id="active-task-title" tabindex="-1" data-i18n="进行中的任务">In progress</h2>
        <p id="active-task-empty" class="task-empty hint" data-i18n="当前没有正在运行的任务。" hidden>No tasks are running.</p>
        <ol id="active-tasks" class="task-list" role="list" hidden></ol>
      </section>
      <section class="task-section" aria-labelledby="task-history-title">
        <div class="task-history-heading">
          <h2 id="task-history-title" tabindex="-1" data-i18n="近期任务">Recent tasks</h2>
          <div class="task-filters">
            <label for="task-search"><span data-i18n="搜索项目或操作">Search project or action</span><input id="task-search" type="search" maxlength="120" autocomplete="off"></label>
            <label for="task-status"><span data-i18n="任务结果">Outcome</span><select id="task-status">
              <option value="all" data-i18n="全部结果">All outcomes</option>
              <option value="succeeded" data-i18n="已完成">Completed</option>
              <option value="failed" data-i18n="操作失败">Operation failed</option>
              <option value="cancelled" data-i18n="已取消">Cancelled</option>
              <option value="partially-completed" data-i18n="本地项目已创建，发布未完成">Local project created, publishing incomplete</option>
            </select></label>
          </div>
        </div>
        <p id="history-task-notice" class="hint task-notice" role="status"></p>
        <p id="history-task-empty" class="task-empty hint" hidden></p>
        <ol id="recent-tasks" class="task-list" role="list" hidden></ol>
      </section>
    </main>
  </div>
</body>
</html>
