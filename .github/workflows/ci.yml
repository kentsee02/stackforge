name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
  database-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/database/**/*.test.mjs"
      - name: Verify Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-tools libglib2.0-bin
          npm run test:secret-service
      - if: runner.os == 'Linux'
        run: |
          docker pull postgres:17
          docker pull mysql:8.4
          npm run test:database-integration
          npm run test:development-postgres
          npm run test:development-mysql
          npm run test:migration-sql-server
          npm run test:native-migrations
          npm run test:prisma-integration -- --large
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:PGBIN;$env:PATH"
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            pg_isready -h 127.0.0.1 -q
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not become ready' }
          $env:STACKFORGE_TEST_PG_PASSWORD = 'root'
          npm run test:database-integration -- --windows-native
  public-migration-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:public-migrations
  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  stack-integration:
    strategy:
      fail-fast: false
      matrix:
        stack: [node, java, nest]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: matrix.stack == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:integration -- --only=${{ matrix.stack }}
