name: Prepare release draft
run-name: Prepare StackForge ${{ inputs.version }} release draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version tag such as v0.32.3
        required: true
        type: string
      commit:
        description: Tested commit SHA on main (defaults to the selected main commit)
        type: string
      notes:
        description: Optional English summary to add before GitHub's generated notes
        type: string

concurrency:
  group: release-draft-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and CI, then create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.commit }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          target="${TARGET_SHA:-$GITHUB_SHA}"
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter a stable version tag such as v0.32.3."
            exit 1
          fi
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$target" HEAD; then
            echo "::error::Choose a full commit SHA in the history of main."
            exit 1
          fi
          version="${RELEASE_VERSION#v}"
          if ! git show "$target:package.json" | jq -e --arg version "$version" '.version == $version' >/dev/null ||
             ! git show "$target:package-lock.json" | jq -e --arg version "$version" '.version == $version and .packages[""].version == $version' >/dev/null; then
            echo "::error::The release tag must match package.json and package-lock.json at the selected commit."
            exit 1
          fi

          ci="$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$target" -f branch=main -f event=push -f per_page=1)"
          if ! jq -e --arg sha "$target" \
            '.workflow_runs[0] | .head_sha == $sha and .status == "completed" and .conclusion == "success"' <<<"$ci" >/dev/null; then
            echo "::error::The selected commit must have a successful CI run for its push to main."
            exit 1
          fi
          jq -r '.workflow_runs[0].html_url | "Verified CI: " + .' <<<"$ci"

          tag="refs/tags/$RELEASE_VERSION"
          if git show-ref --verify --quiet "$tag" && [[ "$(git rev-parse "$tag^{commit}")" != "$target" ]]; then
            echo "::error::The release tag already points to a different commit."
            exit 1
          fi
          releases="$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")"
          existing="$(jq -c --arg tag "$RELEASE_VERSION" '[.[][] | select(.tag_name == $tag)] | first // empty' <<<"$releases")"
          if [[ -n "$existing" ]]; then
            if ! git show-ref --verify --quiet "$tag" &&
               ! jq -e --arg sha "$target" '.target_commitish == $sha' <<<"$existing" >/dev/null; then
              echo "::error::An existing release for this version targets a different commit."
              exit 1
            fi
            jq -r '"Release already exists: " + .html_url' <<<"$existing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          url="$(printf '%s' "$RELEASE_NOTES" | gh release create "$RELEASE_VERSION" --repo "$GH_REPO" \
            --title "StackForge $RELEASE_VERSION" --target "$target" --draft --generate-notes --notes-file -)"
          printf 'Created release draft for %s at `%s`.\n\n[Review the draft](%s)\n' \
            "$RELEASE_VERSION" "$target" "$url" >> "$GITHUB_STEP_SUMMARY"
